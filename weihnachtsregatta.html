<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Wettbewerbszentrale des The Old Smugglers Club">
  <link rel="stylesheet" href="./wettbewerb.css?v=4.9.2-HF12-HF97">
  <title>Wettbewerbszentrale | The Old Smugglers Club</title>
  <link rel="stylesheet" href="./accessibility-v33.css">
  <link rel="stylesheet" href="./legal.css">
  <style>
    /* Weihnachtsregatta: bewusst seitenlokales Ein-Fenster-Layout.
       Keine gemeinsamen Wettbewerbs-Renderer oder Styles werden verändert. */
    .page-weihnachtsregatta #info-cards {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
    }

    .page-weihnachtsregatta #info-cards > .info-card:first-child {
      width: 100%;
      aspect-ratio: 1916 / 821;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .page-weihnachtsregatta #info-cards > .info-card:first-child > p,
    .page-weihnachtsregatta #info-cards > .info-card:first-child .feature-image-box {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .page-weihnachtsregatta #info-cards > .info-card:first-child .feature-image-box {
      display: block;
      overflow: hidden;
      background: #130b06;
    }

    .page-weihnachtsregatta #info-cards > .info-card:first-child .feature-image-box::before {
      display: none;
    }

    .page-weihnachtsregatta #info-cards > .info-card:first-child .feature-image {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      object-position: center center;
    }

    @media (max-width: 700px) {
      .page-weihnachtsregatta #info-cards > .info-card:first-child {
        aspect-ratio: 1916 / 821;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="topline">
        <div class="eyebrow is-hidden" id="eyebrow"></div>
        <div class="status-plaque is-hidden" id="status-plaque"></div>
      </div>

      <h1 id="title"></h1>
      <p class="lead is-hidden" id="description"></p>

      <div class="card-grid is-hidden" id="info-cards"></div>

      <div class="status-box is-hidden" id="status-box">
        <strong id="status-title"></strong>
        <span id="status-text"></span>
      </div>

      <div class="sections is-hidden" id="dynamic-sections"></div>

      <div class="actions is-hidden" id="actions"></div>

      <div class="error is-hidden" id="error"></div>
    </section>
    <footer id="footer-text"></footer>
  </main>
  <script src="./datenregister.js" defer></script>
  <script src="./datenmodell.js" defer></script>
  <script src="./team-badge.js?v=4.9.2-HF12-HF61" defer></script>

</body>
</html>
