<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team- und Teilnehmerpflege | The Old Smugglers Club</title><link rel="icon" href="favicon.jpeg"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="team-teilnehmerpflege.css"><link rel="stylesheet" href="accessibility-v33.css"></head>
<body><main class="admin-shell team-editor-shell"><header class="admin-header"><p class="admin-kicker">The Old Smugglers Club</p><h1>Zentrale Team- und Teilnehmerdaten</h1><p>Mannschaften und Mitspieler lokal prüfen, bearbeiten und als vollständige JSON-Dateien exportieren.</p><nav class="admin-nav"><a class="admin-button" href="admin.html">Administration</a><a class="admin-button" href="index.html">Startseite</a><button class="admin-button" id="reloadButton" type="button">Daten neu laden</button></nav></header>
<section class="admin-section"><div class="admin-heading-row"><h2>Mannschaften</h2><span id="teamBadge" class="admin-badge">Wird geladen</span></div><div id="teamSummary" class="admin-grid"></div><div class="pflege-grid"><div><div class="pflege-filter"><input id="teamSearch" type="search" placeholder="Team suchen"><button class="admin-button" id="newTeam" type="button">Neues Team</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>ID</th><th>Land</th><th>Wettbewerb</th><th>Status</th><th></th></tr></thead><tbody id="teamRows"></tbody></table></div></div><form id="teamForm" class="pflege-form"><input id="teamOriginalId" type="hidden"><label>ID<input id="teamId" required pattern="[a-z0-9-]+"></label><label>Name<input id="teamName" required></label><label>Kurzname<input id="teamShort" required></label><label>Land<input id="teamCountry" required></label><label>Nationaler Wettbewerb<input id="teamNational"></label><label>Logo-Pfad<input id="teamLogo"></label><label class="pflege-check"><input id="teamActive" type="checkbox" checked> Aktiv</label><div id="teamErrors"></div><div class="pflege-actions"><button class="admin-button" type="submit">Lokal speichern</button><button class="admin-button" id="deleteTeam" type="button" disabled>Löschen</button><button class="admin-button" id="exportTeams" type="button">teams.json exportieren</button></div></form></div></section>
<section class="admin-section"><div class="admin-heading-row"><h2>Teilnehmer</h2><span id="participantBadge" class="admin-badge">Wird geladen</span></div><div id="participantSummary" class="admin-grid"></div><div class="pflege-grid"><div><div class="pflege-filter"><input id="participantSearch" type="search" placeholder="Teilnehmer suchen"><select id="participantTeamFilter"><option value="">Alle Smuggler-Teams</option><option>Old Smugglers Team</option><option>New Smugglers Team</option><option value="__none__">Ohne Zuordnung</option></select><button class="admin-button" id="newParticipant" type="button">Neuer Teilnehmer</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>ID</th><th>Smuggler-Team</th><th>Status</th><th></th></tr></thead><tbody id="participantRows"></tbody></table></div></div><form id="participantForm" class="pflege-form"><input id="participantOriginalId" type="hidden"><label>ID<input id="participantId" required pattern="[a-z0-9-]+"></label><label>Anzeigename<input id="participantName" required></label><label>Smuggler-Team<select id="participantTeam"><option value="">Nicht zugeordnet</option><option>Old Smugglers Team</option><option>New Smugglers Team</option></select></label><label>Mitglied seit<input id="participantJoined" type="datetime-local"></label><label>Sprache<input id="participantLanguage" maxlength="5" value="de"></label><label>Notiz<textarea id="participantNote" rows="3"></textarea></label><label class="pflege-check"><input id="participantActive" type="checkbox" checked> Aktiv</label><div id="participantErrors"></div><div class="pflege-actions"><button class="admin-button" type="submit">Lokal speichern</button><button class="admin-button" id="deleteParticipant" type="button" disabled>Löschen</button><button class="admin-button" id="exportParticipants" type="button">teilnehmer.json exportieren</button></div></form></div></section><div id="message" class="admin-notices" aria-live="polite"></div></main><script src="datenregister.js"></script><script src="team-teilnehmerpflege.js"></script><script src="accessibility-v33.js" defer></script></body></html>
