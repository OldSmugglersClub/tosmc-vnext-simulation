name: HF16 Live-Bereinigung

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Falsche Terminbestätigungen bereinigen
        run: node scripts/hf16-bereinigen.mjs

      - name: Persistenten Terminstand aktualisieren
        run: node scripts/schedule-terminstand.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json schedule-terminstand.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Datenänderung."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- spieldaten.json schedule-terminstand.json
          fi

      - name: Bereinigten Terminstand committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spieldaten.json
          if [ -f schedule-terminstand.json ]; then
            git add schedule-terminstand.json
          fi
          git commit -m "HF16: Terminstatus und Persistenz bereinigen"
          git push
