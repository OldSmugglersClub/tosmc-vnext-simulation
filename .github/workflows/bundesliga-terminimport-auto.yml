name: Bundesliga Termine – automatisch

on:
  workflow_dispatch:
  schedule:
    # Viermal täglich. Die Fachlogik schreibt nur bei neuen, sicher konkretisierbaren Terminen.
    # Scheduler-Neuregistrierung 2026-08-27 – keine funktionale Änderung.
    - cron: "27 */6 * * *"

permissions:
  contents: write

concurrency:
  # Absichtlich dieselbe Gruppe wie Phase 6A, damit niemals zwei Automatismen
  # gleichzeitig spieldaten.json verändern.
  group: osc-bundesliga-ergebnisimport
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Bundesliga-Termine aus OpenLigaDB prüfen
        run: |
          node scripts/bundesliga-terminimport-auto.mjs
          node scripts/schedule-terminstand.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json && { [ ! -f schedule-terminstand.json ] || git diff --quiet -- schedule-terminstand.json; }; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung an spieldaten.json – kein Commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Neue bestätigte Bundesliga-Termine liegen vor."
          fi

      - name: Neue Bundesliga-Termine committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spieldaten.json
          if [ -f schedule-terminstand.json ]; then git add schedule-terminstand.json; fi
          git commit -m "Bundesliga-Termine automatisch aktualisiert"
          git push
