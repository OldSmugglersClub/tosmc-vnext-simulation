name: Bundesliga Ergebnisse – automatisch

on:
  workflow_dispatch:
  schedule:
    # GitHub-Cron läuft in UTC. Der Workflow ist nur der Wecker.
    # Die Fachlogik entscheidet lokal, ob überhaupt ein OpenLigaDB-Abruf nötig ist.
    # Scheduler-Neuregistrierung 2026-08-27 – keine funktionale Änderung.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: osc-bundesliga-ergebnisimport
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Bundesliga-Ergebnisimport und Torjäger prüfen
        run: |
          node scripts/bundesliga-ergebnisimport-auto.mjs
          node scripts/bundesliga-torjaeger-auto.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json bundesliga-torjaeger.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung an Bundesliga-Ergebnissen oder Torjägerdaten – kein Commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Neue Bundesliga-Ergebnis- oder Torjägerdaten liegen vor."
          fi

      - name: Neue bestätigte Ergebnisse committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spieldaten.json bundesliga-torjaeger.json
          git commit -m "Bundesliga Ergebnisse und Torjäger automatisch aktualisiert"
          git push
